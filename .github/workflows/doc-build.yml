name: Build Documentation

on:
  push:
    branches:
      - main
      - doc-builder*
    paths:
      - docs/**
      - .github/workflows/doc-build.yml

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@17ccdf17e0f5e5f88b1ce9f20b3b73fb19017169  # main
    with:
      commit_sha: ${{ github.sha }}
      package: hugs-docs
      package_name: hugs
      additional_args: --not_python_module
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
